openapi: 3.0.3
info:
  title: NEXUS API
  version: 0.1.0
  description: API contract for lab lifecycle, progress, flags, and future provider integrations.
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/health:
    get:
      responses:
        "200":
          description: API is healthy
  /api/test/targets:
    get:
      responses:
        "200":
          description: Allowlisted local training targets
  /api/test/request:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, url]
              properties:
                method: {type: string}
                url: {type: string}
                headers: {type: object}
                body: {type: string}
      responses:
        "200": {description: Real lab HTTP response}
        "400": {description: Invalid HTTP method or request}
        "403": {description: Target outside the NEXUS local-lab allowlist}
        "413": {description: Request body too large}
        "502": {description: Lab target unavailable or request failed}
  /api/labs:
    get:
      responses:
        "200":
          description: List available labs
  /api/labs/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Lab details
  /api/labs/{id}/start:
    post:
      responses:
        "202":
          description: Lab start accepted
  /api/labs/{id}/stop:
    post:
      responses:
        "202":
          description: Lab stop accepted
  /api/progress:
    get:
      responses:
        "200":
          description: Current learner progress
  /api/flags/verify:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labId, flag]
              properties:
                labId: {type: string}
                flag: {type: string}
      responses:
        "200":
          description: Verification result
