services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "127.0.0.1:3011:3000"
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat:latest
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9091:9090"
    environment:
      TZ: Asia/Kolkata
    restart: unless-stopped

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    depends_on:
      - dvwa-db
    environment:
      DB_SERVER: dvwa-db
    ports:
      - "127.0.0.1:4280:80"
    restart: unless-stopped

  dvwa-db:
    image: mariadb:10
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    volumes:
      - dvwa-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  dvwa-data:

networks:
  nexus-lab:
    internal: true


  nexus-workstation:
    build:
      context: ./workstation
      dockerfile: Dockerfile
    command: ["sleep","infinity"]
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      - nexus-lab
    profiles:
      - workstation
